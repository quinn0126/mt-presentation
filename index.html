<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>大地电磁 (MT) 正演计算与 AI 智能体应用综合汇报演示</title>
  <meta name="description" content="大地电磁 (MT) 正演计算综合汇报：控制方程、数值方法综述、人工智能与智能体协同工作流演示。">
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&family=Outfit:wght@400;500;600;700&family=Noto+Serif+SC:wght@500;700&display=swap" rel="stylesheet">
  
  <!-- MathJax -->
  <script>
    window.MathJax = {
      tex: {
        inlineMath: [['$', '$'], ['\\(', '\\)']],
        displayMath: [['$$', '$$'], ['\\[', '\\]']]
      },
      svg: {
        fontCache: 'global'
      }
    };
  </script>
  <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

  <!-- Three.js and OrbitControls -->
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

  <style>
    :root {
      /* Premium Warm Light Color Palette */
      --bg-dark: #faf6ef;
      --bg-panel: #fdfbf7;
      --bg-card: rgba(253, 251, 247, 0.94);
      --border-color: #e6dfd3;
      --border-color-active: #b45309;
      --text-primary: #2d2417;
      --text-secondary: #5d4f3b;
      --text-muted: #8c7e6b;
      
      --color-amber: #b45309;
      --color-royal-blue: #2563eb;
      --color-forest-green: #16a34a;
      --color-crimson: #b91c1c;
      --color-purple: #7c3aed;
      --color-yellow: #d97706;

      --theme-glow: rgba(180, 83, 9, 0.08);
      --box-shadow-color: rgba(60, 47, 29, 0.08);
      
      --font-display: 'Outfit', 'Noto Serif SC', serif;
      --font-body: 'Outfit', system-ui, -apple-system, sans-serif;
      --font-mono: 'Fira Code', monospace;

      /* New themed variables */
      --header-bg: rgba(253, 251, 247, 0.95);
      --formula-bg: #f6efe2;
      --table-header-bg: #f2e9d7;
      --widget-canvas-bg: #faf6ee;
      --agent-sheet-bg: #fdfbf7;
      --slider-track-bg: #e6dfd3;
      --select-bg: #fdfbf7;
      --pre-bg: #f6efe2;
      --highlight-bg: rgba(180, 83, 9, 0.02);
    }

    body.theme-dark {
      --bg-dark: #070a13;
      --bg-panel: #0d1326;
      --bg-card: rgba(13, 19, 38, 0.94);
      --border-color: #1e294b;
      --border-color-active: #00f2fe;
      --text-primary: #f8fafc;
      --text-secondary: #94a3b8;
      --text-muted: #64748b;
      --color-amber: #00f2fe;
      --color-royal-blue: #3b82f6;
      --color-forest-green: #22c55e;
      --color-crimson: #f43f5e;
      --color-purple: #c084fc;
      --color-yellow: #eab308;
      --theme-glow: rgba(0, 242, 254, 0.08);
      --box-shadow-color: rgba(0, 0, 0, 0.4);
      --header-bg: rgba(13, 19, 38, 0.95);
      --formula-bg: #0b0f19;
      --table-header-bg: #131b2e;
      --widget-canvas-bg: #070a13;
      --agent-sheet-bg: #0d1326;
      --slider-track-bg: #1e294b;
      --select-bg: #0d1326;
      --pre-bg: #0b0f19;
      --highlight-bg: rgba(0, 242, 254, 0.02);
    }

    body.theme-light {
      --bg-dark: #f1f5f9;
      --bg-panel: #ffffff;
      --bg-card: rgba(255, 255, 255, 0.94);
      --border-color: #cbd5e1;
      --border-color-active: #2563eb;
      --text-primary: #0f172a;
      --text-secondary: #475569;
      --text-muted: #64748b;
      --color-amber: #2563eb;
      --color-royal-blue: #3b82f6;
      --color-forest-green: #16a34a;
      --color-crimson: #b91c1c;
      --color-purple: #7c3aed;
      --color-yellow: #d97706;
      --theme-glow: rgba(37, 99, 235, 0.08);
      --box-shadow-color: rgba(0, 0, 0, 0.08);
      --header-bg: rgba(255, 255, 255, 0.95);
      --formula-bg: #f8fafc;
      --table-header-bg: #e2e8f0;
      --widget-canvas-bg: #f1f5f9;
      --agent-sheet-bg: #ffffff;
      --slider-track-bg: #cbd5e1;
      --select-bg: #ffffff;
      --pre-bg: #f8fafc;
      --highlight-bg: rgba(37, 99, 235, 0.02);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-primary);
      font-family: var(--font-body);
      overflow: hidden;
      height: 100vh;
      display: flex;
      flex-direction: column;
      user-select: none;
    }

    /* Background Animation Grid */
    .bg-grid {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -1;
      background-image: 
        linear-gradient(rgba(140, 126, 107, 0.08) 1px, transparent 1px),
        linear-gradient(90deg, rgba(140, 126, 107, 0.08) 1px, transparent 1px);
      background-size: 60px 60px;
      opacity: 0.8;
      pointer-events: none;
    }

    .bg-glow {
      position: absolute;
      width: 800px;
      height: 800px;
      background: radial-gradient(circle, rgba(180, 83, 9, 0.03) 0%, transparent 70%);
      top: -300px;
      left: -300px;
      z-index: -1;
      pointer-events: none;
    }

    /* Header Styling */
    header {
      background: rgba(253, 251, 247, 0.95);
      border-bottom: 1px solid var(--border-color);
      padding: 15px 40px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      backdrop-filter: blur(10px);
      z-index: 10;
      flex-shrink: 0;
      box-shadow: 0 4px 15px var(--box-shadow-color);
    }

    .logo-section {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo-badge {
      background: linear-gradient(135deg, var(--color-amber) 0%, var(--color-yellow) 100%);
      color: #fff;
      font-weight: 800;
      padding: 4px 12px;
      border-radius: 6px;
      font-size: 14px;
      box-shadow: 0 2px 8px rgba(180, 83, 9, 0.2);
    }

    .logo-title {
      font-family: var(--font-display);
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 0.5px;
      color: var(--text-primary);
    }

    .nav-tabs {
      display: flex;
      gap: 8px;
    }

    .nav-tab {
      background: transparent;
      border: 1px solid transparent;
      color: var(--text-secondary);
      padding: 6px 14px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
    }

    .nav-tab:hover {
      color: var(--text-primary);
      background: rgba(230, 223, 211, 0.4);
    }

    .nav-tab.active {
      color: #fff;
      background: var(--color-amber);
      border-color: var(--color-amber);
    }

    /* Main Slideshow Viewport (Expanded, Full Screen Feeling) */
    .slideshow-viewport {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      padding: 3vh 5vw;
      overflow: hidden;
    }

    /* Fullscreen Slide Container */
    .slide-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 20px;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      box-shadow: 0 15px 40px var(--box-shadow-color);
      backdrop-filter: blur(20px);
      padding: 4vh 5vw;
      position: relative;
      overflow: hidden;
      transition: opacity 0.3s ease;
    }

    .slide-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 12px;
      margin-bottom: 20px;
      flex-shrink: 0;
      z-index: 5;
    }

    .slide-module-tag {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: var(--color-amber);
      background: rgba(180, 83, 9, 0.08);
      padding: 4px 8px;
      border-radius: 4px;
    }

    .slide-title-area h2 {
      font-family: var(--font-display);
      font-size: 26px;
      font-weight: 700;
      margin-top: 6px;
      color: var(--text-primary);
    }

    .slide-body {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 20px;
      font-size: 16px;
      line-height: 1.65;
      color: var(--text-primary);
      overflow-y: auto;
      z-index: 5;
      padding-right: 10px;
    }

    .slide-body p {
      color: var(--text-secondary);
    }

    .slide-body ul, .slide-body ol {
      margin-left: 24px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .slide-body li {
      color: var(--text-secondary);
    }

    .slide-body li strong {
      color: var(--text-primary);
      font-weight: 600;
    }

    /* Grid Layouts for Content */
    .grid-2col {
      display: grid;
      grid-template-columns: 1.1fr 0.9fr;
      gap: 40px;
      align-items: center;
      height: 100%;
    }

    .grid-2col-content {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 30px;
    }

    .grid-3col {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
    }

    /* Scientific Formulas Panel */
    .formula-panel {
      background: var(--formula-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 16px 20px;
      margin: 10px 0;
      text-align: center;
      color: var(--text-primary);
      box-shadow: inset 0 2px 4px rgba(60, 47, 29, 0.03);
    }

    /* Tables */
    .table-container {
      overflow-x: auto;
      margin: 10px 0;
      border: 1px solid var(--border-color);
      border-radius: 12px;
      background: var(--bg-panel);
      box-shadow: 0 4px 12px var(--box-shadow-color);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      font-size: 14px;
    }

    th {
      background: var(--table-header-bg);
      color: var(--text-primary);
      font-weight: 700;
      padding: 12px 16px;
      border-bottom: 2px solid var(--border-color);
    }

    pre {
      background: var(--pre-bg) !important;
    }

    td {
      padding: 12px 16px;
      border-bottom: 1px solid var(--border-color);
      color: var(--text-secondary);
    }

    tr:last-child td {
      border-bottom: none;
    }

    tr:hover td {
      background: rgba(230, 223, 211, 0.25);
    }

    /* Highlight boxes */
    .highlight-box {
      background: rgba(180, 83, 9, 0.02);
      border-left: 5px solid var(--color-amber);
      padding: 16px;
      border-radius: 0 10px 10px 0;
      margin: 8px 0;
    }

    .highlight-box-title {
      font-family: var(--font-display);
      font-weight: 700;
      color: var(--color-amber);
      font-size: 14px;
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    /* Title Slide Custom Layout */
    .title-slide {
      align-items: center;
      justify-content: center;
      text-align: center;
      background: radial-gradient(circle at center, #fdfbf7 0%, #faf6ef 100%);
    }

    .title-slide h1 {
      font-family: var(--font-display);
      font-size: 40px;
      font-weight: 800;
      line-height: 1.3;
      margin-bottom: 15px;
      background: linear-gradient(135deg, var(--text-primary) 30%, var(--color-amber) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .title-slide h3 {
      font-family: var(--font-body);
      font-size: 18px;
      font-weight: 500;
      color: var(--text-secondary);
      margin-bottom: 40px;
      letter-spacing: 1.5px;
    }

    .title-slide-meta {
      display: flex;
      justify-content: center;
      gap: 40px;
      margin-top: 30px;
      border-top: 1px solid var(--border-color);
      padding-top: 30px;
      width: 80%;
      max-width: 800px;
    }

    .meta-item {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .meta-label {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 1.5px;
    }

    .meta-value {
      font-size: 14px;
      font-weight: 700;
      color: var(--text-primary);
    }

    /* Bottom Controller Bar */
    .controller-bar {
      background: rgba(253, 251, 247, 0.96);
      border-top: 1px solid var(--border-color);
      padding: 15px 40px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      backdrop-filter: blur(10px);
      z-index: 10;
      flex-shrink: 0;
      box-shadow: 0 -4px 15px var(--box-shadow-color);
    }

    .ctrl-left-group, .ctrl-right-group {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .ctrl-btn {
      background: transparent;
      border: 1px solid rgba(140, 126, 107, 0.3);
      color: var(--text-secondary);
      width: 38px;
      height: 38px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s;
      outline: none;
    }

    .ctrl-btn:hover {
      color: var(--text-primary);
      border-color: var(--border-color-active);
      background: rgba(230, 223, 211, 0.3);
    }

    .ctrl-btn:disabled {
      opacity: 0.3;
      cursor: not-allowed;
    }

    .ctrl-progress {
      font-family: var(--font-mono);
      font-size: 13px;
      color: var(--text-muted);
    }

    /* Dots Pagination Indicator */
    .dots-container {
      display: flex;
      gap: 6px;
      max-width: 50vw;
      overflow-x: auto;
      padding: 4px;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background-color: var(--border-color);
      cursor: pointer;
      transition: all 0.25s ease;
      flex-shrink: 0;
    }

    .dot.active {
      background-color: var(--color-amber);
      transform: scale(1.35);
      box-shadow: 0 0 8px rgba(180, 83, 9, 0.4);
    }

    /* Screen Left/Right Floating Flip Buttons */
    .floating-flip-btn {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 60px;
      height: 100px;
      background: rgba(253, 251, 247, 0.4);
      border: 1px solid rgba(230, 223, 211, 0.5);
      backdrop-filter: blur(5px);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      opacity: 0;
      transition: opacity 0.3s, background-color 0.2s;
      z-index: 100;
      font-size: 24px;
      color: var(--text-secondary);
    }

    .slideshow-viewport:hover .floating-flip-btn {
      opacity: 1;
    }

    .floating-flip-btn:hover {
      background: rgba(253, 251, 247, 0.85);
      color: var(--color-amber);
      border-color: var(--color-amber);
    }

    .floating-flip-left {
      left: 10px;
      border-radius: 0 12px 12px 0;
    }

    .floating-flip-right {
      right: 10px;
      border-radius: 12px 0 0 12px;
    }

    /* Slide Drawer Menu (Sidebar Table of Contents) */
    .drawer-menu {
      position: fixed;
      top: 0;
      left: -320px;
      width: 320px;
      height: 100vh;
      background: var(--bg-panel);
      border-right: 1px solid var(--border-color);
      box-shadow: 5px 0 25px rgba(0,0,0,0.08);
      z-index: 200;
      transition: left 0.3s cubic-bezier(0.1, 0.9, 0.2, 1);
      display: flex;
      flex-direction: column;
      padding: 30px 20px;
      overflow-y: auto;
    }

    .drawer-menu.open {
      left: 0;
    }

    .drawer-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(60, 47, 29, 0.2);
      backdrop-filter: blur(4px);
      z-index: 190;
      display: none;
    }

    .drawer-overlay.open {
      display: block;
    }

    .sidebar-title {
      font-family: var(--font-display);
      font-size: 13px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: var(--text-muted);
      margin-bottom: 10px;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 5px;
    }

    .slide-link {
      background: transparent;
      border: none;
      text-align: left;
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 13px;
      color: var(--text-secondary);
      cursor: pointer;
      transition: all 0.2s;
      width: 100%;
      display: flex;
      align-items: center;
      gap: 10px;
      outline: none;
    }

    .slide-link:hover {
      background: rgba(230, 223, 211, 0.4);
      color: var(--text-primary);
    }

    .slide-link.active {
      background: rgba(180, 83, 9, 0.08);
      color: var(--color-amber);
      font-weight: 600;
    }

    .slide-link-num {
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--text-muted);
    }

    /* Interactive 3D Fullscreen Styles */
    .slide-card.fullscreen-3d {
      padding: 0;
      border: 1px solid var(--border-color);
      box-shadow: 0 15px 45px var(--box-shadow-color);
      border-radius: 20px;
    }

    .canvas-3d-fullbleed {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
      cursor: grab;
    }

    .canvas-3d-fullbleed:active {
      cursor: grabbing;
    }

    .floating-panel {
      position: absolute;
      top: 4vh;
      left: 4vw;
      z-index: 10;
      width: 430px;
      background: rgba(253, 251, 247, 0.85);
      border: 1px solid rgba(230, 223, 211, 0.8);
      border-radius: 16px;
      padding: 24px;
      backdrop-filter: blur(16px);
      box-shadow: 0 10px 30px var(--box-shadow-color);
      pointer-events: auto;
      max-height: 92%;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .floating-panel h3 {
      font-family: var(--font-display);
      font-size: 18px;
      font-weight: 700;
      color: var(--text-primary);
    }

    .floating-panel p {
      font-size: 13.5px;
      color: var(--text-secondary);
      line-height: 1.55;
    }

    /* Form controls and widgets */
    .control-group-widget {
      display: flex;
      flex-direction: column;
      gap: 6px;
      background: rgba(246, 239, 226, 0.3);
      padding: 12px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
    }

    .widget-label-row {
      display: flex;
      justify-content: space-between;
      font-size: 12.5px;
      font-weight: 600;
      color: var(--text-secondary);
    }

    .widget-val {
      font-family: var(--font-mono);
      color: var(--color-amber);
    }

    input[type="range"].widget-slider {
      width: 100%;
      background: var(--slider-track-bg);
      height: 6px;
      border-radius: 3px;
      outline: none;
      cursor: pointer;
      accent-color: var(--color-amber);
    }

    select.widget-select {
      background: var(--select-bg);
      border: 1px solid var(--border-color);
      color: var(--text-primary);
      padding: 6px 10px;
      border-radius: 6px;
      outline: none;
      font-size: 13px;
      cursor: pointer;
      font-family: inherit;
    }

    select.widget-select:focus {
      border-color: var(--color-amber);
    }

    /* Embedded Iframe */
    .iframe-container {
      width: 100%;
      height: 480px;
      border: 1px solid var(--border-color);
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 8px 24px var(--box-shadow-color);
    }

    /* 2D Canvas container styles */
    .widget-2d-canvas-container {
      position: relative;
      background: var(--widget-canvas-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      width: 100%;
      height: 250px;
      overflow: hidden;
      box-shadow: inset 0 2px 5px rgba(60, 47, 29, 0.05);
    }

    /* SVG Plotting styles */
    .plot-container-svg {
      background: var(--widget-canvas-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      width: 100%;
      height: 260px;
      position: relative;
      box-shadow: inset 0 2px 5px rgba(60, 47, 29, 0.05);
    }

    .plot-svg {
      width: 100%;
      height: 100%;
    }

    .axis-line {
      stroke: var(--border-color);
      stroke-width: 1.5;
    }

    .grid-line {
      stroke: var(--border-color);
      opacity: 0.35;
      stroke-width: 0.5;
    }

    .grid-line-major {
      stroke: var(--border-color);
      opacity: 0.65;
      stroke-width: 0.8;
    }

    .plot-axis-label {
      font-size: 10px;
      fill: var(--text-muted);
      font-family: var(--font-body);
    }

    .plot-legend-text {
      font-size: 10px;
      font-weight: 600;
      font-family: var(--font-body);
    }

        const d = b.r * b.r + b.i * b.i;
        return {r: (a.r * b.r + a.i * b.i) / d, i: (a.i * b.r - a.r * b.i) / d};

      tanh: (a) => {
        const x = a.r, y = a.i;
        const denom = Math.cosh(2 * x) + Math.cos(2 * y);
        if (denom === 0) return {r: 0, i: 0};

      }
      if (oodAnimationId) {
        cancelAnimationFrame(oodAnimationId);
        oodAnimationId = null;
      }
      if (convAnimationId) {
        cancelAnimationFrame(convAnimationId);
        convAnimationId = null;
      }
    }

    // Clean up Three.js scenes to avoid memory leaks
    function destroyThreeScenes() {
      Object.keys(threeInstances).forEach(key => {
        const inst = threeInstances[key];
        if (inst.animationId) {
          cancelAnimationFrame(inst.animationId);
          inst.animationId = null;
        }
        if (inst.controls) {
          inst.controls.dispose();
          inst.controls = null;
        }
        if (inst.renderer) {
          inst.renderer.dispose();
          if (inst.renderer.domElement && inst.renderer.domElement.parentNode) {
            inst.renderer.domElement.parentNode.removeChild(inst.renderer.domElement);
          }
          inst.renderer = null;
        }
        inst.scene = null;
        inst.camera = null;
        inst.meshGroup = null;
        inst.eGroup = null;
        inst.hGroup = null;
      });
    }

    // Render Slide
    function renderSlide(index) {
      stopWidgetAnimations();
      destroyThreeScenes();
      currentSlideIndex = index;
      
      const slide = linearSlides[index];
      const slideContainer = document.getElementById("slide-container");

      // Update Header Navigation Tab styles
      const tabs = document.querySelectorAll(".nav-tab");
      tabs.forEach((tab, idx) => {
        if (idx === slide.moduleIndex) {
          tab.classList.add("active");
        } else {
          tab.classList.remove("active");
        }
      });

      // Update drawer active items
      const links = document.querySelectorAll(".slide-link");
      links.forEach((link, idx) => {
        if (idx === index) {
          link.classList.add("active");
        } else {
          link.classList.remove("active");
        }
      });

      // Update dots active item
      const dots = document.querySelectorAll(".dot");
      dots.forEach((dot, idx) => {
        if (idx === index) {
          dot.classList.add("active");
          dot.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
        } else {
          dot.classList.remove("active");
        }
      });

      // Construct slide card HTML
      if (slide.isTitleSlide) {
        slideContainer.innerHTML = `
          <div class="slide-card title-slide">
            ${slide.html}
          </div>
        `;
      } else if (slide.is3DFullscreen) {
        slideContainer.innerHTML = `
          <div class="slide-card fullscreen-3d">
            <!-- Full bleed WebGL canvas background -->
            <div class="canvas-3d-fullbleed" id="${slide.canvasId}"></div>
            ${slide.html}
          </div>
        `;
      } else {
        slideContainer.innerHTML = `
          <div class="slide-card">
            <div class="slide-header">
              <div class="slide-title-area">
                <span class="slide-module-tag">${slide.moduleName} - 页面 ${index + 1} / ${linearSlides.length}</span>
                <h2>${slide.title}</h2>
              </div>
            </div>
            <div class="slide-body">
              ${slide.html}
            </div>
          </div>
        `;
      }

      // Update progress bar footer info
      const progress = document.getElementById("slide-progress");
      progress.innerText = `${index + 1} / ${linearSlides.length}`;
      document.getElementById("slide-module-name").innerText = slide.moduleName;

      document.getElementById("btn-prev").disabled = (index === 0);
      document.getElementById("btn-next").disabled = (index === linearSlides.length - 1);

      // Trigger MathJax scan
      if (window.MathJax && typeof window.MathJax.typeset === 'function') {
        window.MathJax.typeset();
      }

      // Initialize slide-specific widgets after rendering into DOM
      setTimeout(() => {
        if (document.getElementById("skin-wave-canvas")) {
          initSkinWaveCanvas();
        }
        if (document.getElementById("sounding-svg")) {
          run1DForwardSolver();
        }
        if (document.getElementById("polarization-canvas")) {
          initPolarizationWaveCanvas();
        }
        if (document.getElementById("dim-3d-canvas")) {
          initDim3DScene();
          switchDim3D(selectedDim3D);
        }
        if (document.getElementById("yee-3d-canvas")) {
          initYee3DScene();
        }
        if (document.getElementById("fem-3d-canvas")) {
          initFEM3DScene();
        }
        if (document.getElementById("radar-svg")) {
          drawRadarChart();
        }
        if (document.getElementById("conv-svg")) {
          initConvergencePlot();
        }
        if (document.getElementById("ood-svg")) {
          initOODPlot();
        }
        
        // Post theme message to iframe if it exists on load
        const iframe = document.querySelector("iframe");
        if (iframe && iframe.contentWindow) {
          const theme = document.getElementById("presentation-theme-select").value;
          try {
            iframe.contentWindow.postMessage({ type: "setTheme", theme: theme }, "*");
          } catch (e) {
            console.error("Iframe communication error:", e);
          }
        }
      }, 60);
    }

    function jumpToSlide(index) {
      renderSlide(index);
    }

    function nextSlide() {
      if (currentSlideIndex < linearSlides.length - 1) {
        renderSlide(currentSlideIndex + 1);
      }
    }

    function prevSlide() {
      if (currentSlideIndex > 0) {
        renderSlide(currentSlideIndex - 1);
      }
    }

    // Presentation theme control functions
    function changePresentationTheme() {
      const theme = document.getElementById("presentation-theme-select").value;
      setPresentationTheme(theme);
    }

    function setPresentationTheme(theme) {
      const body = document.body;
      body.classList.remove("theme-dark", "theme-light");
      if (theme === "dark") {
        body.classList.add("theme-dark");
      } else if (theme === "light") {
        body.classList.add("theme-light");
      }
      
      // Update Three.js WebGL backgrounds
      updateThreeBackgrounds(theme);

      // Post theme message to iframe
      const iframe = document.querySelector("iframe");
      if (iframe && iframe.contentWindow) {
        try {
          iframe.contentWindow.postMessage({ type: "setTheme", theme: theme }, "*");
        } catch (e) {
          console.error("Iframe communication error:", e);
        }
      }
    }

    function updateThreeBackgrounds(theme) {
      let colorVal = 0xfaf6ef; // default warm
      if (theme === "dark") colorVal = 0x070a13;
      else if (theme === "light") colorVal = 0xf1f5f9;
      
      for (const key in threeInstances) {
        const inst = threeInstances[key];
        if (inst && inst.scene) {
          inst.scene.background.setHex(colorVal);
        }
      }
    }

    // Listen to messages from child iframe (ready message)
    window.addEventListener("message", function(event) {
      if (event.data && event.data.type === "iframeReady") {
        const theme = document.getElementById("presentation-theme-select").value;
        const iframe = document.querySelector("iframe");
        if (iframe && iframe.contentWindow) {
          iframe.contentWindow.postMessage({ type: "setTheme", theme: theme }, "*");
        }
      }
    });

    // Keybindings: Left/Right arrow, Space bar
    document.addEventListener("keydown", (e) => {
      // Avoid firing slide changes if focused on text input/select
      if (document.activeElement.tagName === "INPUT" || document.activeElement.tagName === "SELECT" || document.activeElement.tagName === "TEXTAREA") {
        return;
      }
      if (e.key === "ArrowRight" || e.key === "Space" || e.key === " ") {
        e.preventDefault();
        nextSlide();
      } else if (e.key === "ArrowLeft") {
        e.preventDefault();
        prevSlide();
      }
    });

    // ----------------------------------------------------
    // Widget 1: EM Wave Decay & Skin Depth Visualizer
    // ----------------------------------------------------
    let skinCanvas, skinCtx;
    let skinTime = 0;
    
    function initSkinWaveCanvas() {
      skinCanvas = document.getElementById("skin-wave-canvas");
      if (!skinCanvas) return;
      
      // Resize to container size
      skinCanvas.width = skinCanvas.parentElement.clientWidth;
      skinCanvas.height = skinCanvas.parentElement.clientHeight;
      skinCtx = skinCanvas.getContext("2d");
      
      drawSkinWave();
    }
    
    function drawSkinWave() {
      const rhoEl = document.getElementById("skin-rho");
      const freqEl = document.getElementById("skin-freq");
      if (!rhoEl || !freqEl || !skinCtx) return;
      
      const rho = parseFloat(rhoEl.value);
      const freqLog = parseFloat(freqEl.value);
      const freq = Math.pow(10, freqLog);
      
      document.getElementById("skin-rho-val").innerText = rho;
      document.getElementById("skin-freq-val").innerText = freq >= 1000 ? (freq/1000).toFixed(1) + " kHz" : freq.toFixed(2);
      
      // Calculate delta
      const delta = 503 * Math.sqrt(rho / freq);
      document.getElementById("skin-calc-res").innerText = `当前计算趋肤深度 δ = ${delta >= 1000 ? (delta/1000).toFixed(2) + " km" : delta.toFixed(1) + " m"}`;
      
      if (skinWaveAnimationId) {
        cancelAnimationFrame(skinWaveAnimationId);
      }
      
      // Loop function
      function animLoop() {
        skinTime += 0.05;
        const W = skinCanvas.width, H = skinCanvas.height;
        skinCtx.clearRect(0, 0, W, H);
        
        // Draw layers background
        skinCtx.fillStyle = "rgba(240, 233, 218, 0.4)";
        skinCtx.fillRect(0, 0, W, H * 0.2); // Air / shallow layer
        
        skinCtx.fillStyle = "rgba(230, 220, 200, 0.6)";
        skinCtx.fillRect(0, H * 0.2, W, H); // Solid earth
        
        // Draw Boundary line
        skinCtx.strokeStyle = "#cbd5e1";
        skinCtx.lineWidth = 1.5;
        skinCtx.beginPath();
        skinCtx.moveTo(0, H * 0.2);
        skinCtx.lineTo(W, H * 0.2);
        skinCtx.stroke();
        
        skinCtx.fillStyle = "#5d4f3b";
        skinCtx.font = "10px Outfit";
        skinCtx.fillText("地表 (Z = 0)", 15, H * 0.18);
        
        // Scale physics depth to screen pixels
        // Let's assume maximum visible depth H_earth is 2.5 * delta
        const deltaPixels = H * 0.35; // Let skin depth delta occupy 35% of canvas height
        const z0 = H * 0.2;
        
        // 1. Draw decay envelope curves
        skinCtx.strokeStyle = "rgba(185, 28, 28, 0.35)";
        skinCtx.setLineDash([4, 4]);
        skinCtx.lineWidth = 1;
        
        // Positive envelope
        skinCtx.beginPath();
        for (let y = z0; y < H; y++) {
          const depth = y - z0;
          const amp = (W * 0.35) * Math.exp(-depth / deltaPixels);
          if (y === z0) skinCtx.moveTo(W/2 + amp, y);
          else skinCtx.lineTo(W/2 + amp, y);
        }
        skinCtx.stroke();
        
        // Negative envelope
        skinCtx.beginPath();
        for (let y = z0; y < H; y++) {
          const depth = y - z0;
          const amp = (W * 0.35) * Math.exp(-depth / deltaPixels);
          if (y === z0) skinCtx.moveTo(W/2 - amp, y);
          else skinCtx.lineTo(W/2 - amp, y);
        }
        skinCtx.stroke();
        skinCtx.setLineDash([]); // Reset dash
        
        // 2. Draw 1/e threshold line
        const eDepthY = z0 + deltaPixels;
        if (eDepthY < H) {
          skinCtx.strokeStyle = "rgba(180, 83, 9, 0.65)";
          skinCtx.lineWidth = 1;
          skinCtx.beginPath();
          skinCtx.moveTo(10, eDepthY);
          skinCtx.lineTo(W - 10, eDepthY);
          skinCtx.stroke();
          skinCtx.fillStyle = "var(--color-amber)";
          skinCtx.fillText(`趋肤深度 δ 处 (振幅衰减至 36.8%)`, 15, eDepthY - 5);
        }
        
        // 3. Draw oscillating E-field wave
        skinCtx.strokeStyle = "var(--color-amber)";
        skinCtx.lineWidth = 2.5;
        skinCtx.beginPath();
        
        // Above surface (Air): propagating sine wave without decay
        for (let y = 0; y < z0; y++) {
          const amp = W * 0.35;
          const phase = skinTime - (y - z0) * 0.05;
          const x = W/2 + amp * Math.sin(phase);
          if (y === 0) skinCtx.moveTo(x, y);
          else skinCtx.lineTo(x, y);
        }
        
        // Under surface: Decaying wave
        for (let y = z0; y < H; y++) {
          const depth = y - z0;
          const amp = (W * 0.35) * Math.exp(-depth / deltaPixels);
          // wavenumber beta = 1/delta
          const phase = skinTime - depth / deltaPixels;
          const x = W/2 + amp * Math.sin(phase);
          skinCtx.lineTo(x, y);
        }
        skinCtx.stroke();
        
        skinWaveAnimationId = requestAnimationFrame(animLoop);
      }
      
      animLoop();
    }

    // ----------------------------------------------------
    // Widget 2: 1D Sounding Curves Solver (Resistivity & Phase)
    // ----------------------------------------------------
    const soundingFreqs = [
      0.001, 0.002, 0.005, 0.01, 0.02, 0.05, 0.1, 0.2, 0.5, 1.0, 
      2.0, 5.0, 10.0, 20.0, 50.0, 100.0, 200.0, 500.0, 1000.0
    ];
    let soundingResults = [];

    function run1DForwardSolver() {
      const rho1 = parseFloat(document.getElementById("1d-rho1").value);
      const h1 = parseFloat(document.getElementById("1d-h1").value);
      const rho2 = parseFloat(document.getElementById("1d-rho2").value);
      const h2 = parseFloat(document.getElementById("1d-h2").value);
      const rho3 = parseFloat(document.getElementById("1d-rho3").value);

      const mu0 = 4e-7 * Math.PI;
      soundingResults = [];

      soundingFreqs.forEach(f => {
        const omega = 2 * Math.PI * f;
        
        // Layer 3 (infinite basement)
        const k3 = C.sqrt({r: 0, i: (omega * mu0) / rho3});
        const Z03 = C.div({r: 0, i: omega * mu0}, k3);
        const Z3 = Z03;

        // Layer 2
        const k2 = C.sqrt({r: 0, i: (omega * mu0) / rho2});
        const Z02 = C.div({r: 0, i: omega * mu0}, k2);
        const k2h2 = C.mul(k2, {r: h2, i: 0});
        const tanh2 = C.tanh(k2h2);
        const num2 = C.add(Z3, C.mul(Z02, tanh2));
        const den2 = C.add(Z02, C.mul(Z3, tanh2));
        const Z2 = C.mul(Z02, C.div(num2, den2));

        // Layer 1
        const k1 = C.sqrt({r: 0, i: (omega * mu0) / rho1});
        const Z01 = C.div({r: 0, i: omega * mu0}, k1);
        const k1h1 = C.mul(k1, {r: h1, i: 0});
        const tanh1 = C.tanh(k1h1);
        const num1 = C.add(Z2, C.mul(Z01, tanh1));
        const den1 = C.add(Z01, C.mul(Z2, tanh1));
        const Z1 = C.mul(Z01, C.div(num1, den1));

        // Apparent resistivity
        const absZ1Sq = Z1.r*Z1.r + Z1.i*Z1.i;
        const rho_a = (1 / (omega * mu0)) * absZ1Sq;
        
        // Phase angle in degrees
        let phase = Math.atan2(Z1.i, Z1.r) * (180 / Math.PI);
        if (phase < 0) phase += 360;
        // MT impedance phase resides in 1st quadrant for E-H ratio (usually 0 to 90 degrees)
        // Adjust coordinate mapping
        phase = phase % 90;

        soundingResults.push({f: f, rho_a: rho_a, phase: phase});
      });

      drawSoundingChart();
    }

    const chartW = 340, chartH = 260;
    const paddingLeft = 45, paddingRight = 45, paddingTop = 20, paddingBottom = 40;

    function getChartCoords(freq, rho_a, phase) {
      // f: 10^-3 to 10^3
      // rho_a: 10^0 to 10^4
      // phase: 0 to 90 degrees
      const xMin = -3, xMax = 3;
      const yMinRho = 0, yMaxRho = 4;
      const yMinPh = 0, yMaxPh = 90;

      const xVal = Math.log10(freq);
      const yValRho = Math.log10(Math.max(1, rho_a));
      
      const px = paddingLeft + ((xVal - xMin) / (xMax - xMin)) * (chartW - paddingLeft - paddingRight);
      const pyRho = (chartH - paddingBottom) - ((yValRho - yMinRho) / (yMaxRho - yMinRho)) * (chartH - paddingTop - paddingBottom);
      const pyPhase = (chartH - paddingBottom) - ((phase - yMinPh) / (yMaxPh - yMinPh)) * (chartH - paddingTop - paddingBottom);

      return {x: px, y: pyRho, yPh: pyPhase};
    }

    function drawSoundingChart() {
      const svg = document.getElementById("sounding-svg");
      if (!svg) return;

      // Draw grid lines and curves in raw SVG code
      let gHtml = ``;

      // 1. Draw horizontal grid lines (for Resistivity on left, Phase on right)
      // Left Resistivity ticks: 1, 10, 100, 1000, 10000
      // Right Phase ticks: 0, 15, 30, 45, 60, 75, 90
      for (let i = 0; i <= 4; i++) {
        const coords = getChartCoords(1, Math.pow(10, i), 0);
        gHtml += `<line x1="${paddingLeft}" y1="${coords.y}" x2="${chartW - paddingRight}" y2="${coords.y}" class="grid-line-major" />`;
        gHtml += `<text x="${paddingLeft - 8}" y="${coords.y + 4}" text-anchor="end" class="plot-axis-label">${Math.pow(10, i)}</text>`;
      }
      
      for (let p = 15; p < 90; p += 15) {
        const coords = getChartCoords(1, 1, p);
        // Draw dotted lines for phase intermediate ticks if not overlapping major grid
        if (p !== 45) {
          gHtml += `<line x1="${paddingLeft}" y1="${coords.yPh}" x2="${chartW - paddingRight}" y2="${coords.yPh}" class="grid-line" stroke-dasharray="2 2" />`;
        }
        gHtml += `<text x="${chartW - paddingRight + 8}" y="${coords.yPh + 4}" text-anchor="start" class="plot-axis-label">${p}°</text>`;
      }
      // Right Phase boundary labels
      gHtml += `<text x="${chartW - paddingRight + 8}" y="${getChartCoords(1,1,90).yPh + 4}" text-anchor="start" class="plot-axis-label">90°</text>`;
      gHtml += `<text x="${chartW - paddingRight + 8}" y="${getChartCoords(1,1,0).yPh + 4}" text-anchor="start" class="plot-axis-label">0°</text>`;

      // 2. Draw vertical grid lines (for frequency logarithmic ticks: 10^-3 to 10^3)
      for (let i = -3; i <= 3; i++) {
        const freq = Math.pow(10, i);
        const coords = getChartCoords(freq, 1, 0);
        gHtml += `<line x1="${coords.x}" y1="${paddingTop}" x2="${coords.x}" y2="${chartH - paddingBottom}" class="grid-line-major" />`;
        
        let label = "";
        if (i === -3) label = "10⁻³";
        else if (i === -2) label = "10⁻²";
        else if (i === -1) label = "10⁻¹";
        else if (i === 0) label = "1";
        else if (i === 1) label = "10";
        else if (i === 2) label = "10²";
        else if (i === 3) label = "10³";
        
        gHtml += `<text x="${coords.x}" y="${chartH - paddingBottom + 16}" text-anchor="middle" class="plot-axis-label">${label}</text>`;
      }

      // 3. Axes
      gHtml += `<line x1="${paddingLeft}" y1="${paddingTop}" x2="${paddingLeft}" y2="${chartH - paddingBottom}" class="axis-line" />`;
      gHtml += `<line x1="${chartW - paddingRight}" y1="${paddingTop}" x2="${chartW - paddingRight}" y2="${chartH - paddingBottom}" class="axis-line" />`;
      gHtml += `<line x1="${paddingLeft}" y1="${chartH - paddingBottom}" x2="${chartW - paddingRight}" y2="${chartH - paddingBottom}" class="axis-line" />`;

      // 4. Axis Labels
      gHtml += `<text x="${chartW/2}" y="${chartH - 8}" text-anchor="middle" font-size="10" fill="var(--text-muted)">频率 f (Hz)</text>`;
      gHtml += `<text x="12" y="${chartH/2}" text-anchor="middle" font-size="9" fill="var(--text-secondary)" transform="rotate(-90 12 ${chartH/2})">视电阻率 (Ω·m)</text>`;
      gHtml += `<text x="${chartW - 12}" y="${chartH/2}" text-anchor="middle" font-size="9" fill="var(--text-secondary)" transform="rotate(90 ${chartW - 12} ${chartH/2})">阻抗相位 (deg)</text>`;

      // 5. Plot Apparent Resistivity curve (Solid Amber)
      let dRes = "";
      soundingResults.forEach((pt, idx) => {
        const c = getChartCoords(pt.f, pt.rho_a, pt.phase);
        if (idx === 0) dRes += `M ${c.x} ${c.y}`;
        else dRes += ` L ${c.x} ${c.y}`;
      });
      gHtml += `<path d="${dRes}" fill="none" stroke="var(--color-amber)" stroke-width="2.5" />`;

      // 6. Plot Phase Curve (Dashed Royal Blue)
      let dPh = "";
      soundingResults.forEach((pt, idx) => {
        const c = getChartCoords(pt.f, pt.rho_a, pt.phase);
        if (idx === 0) dPh += `M ${c.x} ${c.yPh}`;
        else dPh += ` L ${c.x} ${c.yPh}`;
      });
      gHtml += `<path d="${dPh}" fill="none" stroke="var(--color-royal-blue)" stroke-width="2" stroke-dasharray="4 3" />`;

      // 7. Legend
      gHtml += `
        <rect x="${paddingLeft + 15}" y="${paddingTop + 10}" width="95" height="35" rx="4" fill="rgba(253,251,247,0.9)" stroke="#e6dfd3" stroke-width="1"/>
        <line x1="${paddingLeft + 25}" y1="${paddingTop + 20}" x2="${paddingLeft + 45}" y2="${paddingTop + 20}" stroke="var(--color-amber)" stroke-width="2.5"/>
        <text x="${paddingLeft + 52}" y="${paddingTop + 23}" class="plot-legend-text" fill="var(--color-amber)">&rho;_a (电阻率)</text>
        <line x1="${paddingLeft + 25}" y1="${paddingTop + 35}" x2="${paddingLeft + 45}" y2="${paddingTop + 35}" stroke="var(--color-royal-blue)" stroke-width="2" stroke-dasharray="3 2"/>
        <text x="${paddingLeft + 52}" y="${paddingTop + 38}" class="plot-legend-text" fill="var(--color-royal-blue)">&phi; (相位)</text>
      `;

      svg.innerHTML = gHtml;
    }

    function showSoundingTooltip(e) {
      const svg = document.getElementById("sounding-svg");
      const tooltip = document.getElementById("sounding-tooltip");
      if (!svg || !tooltip) return;

      const rect = svg.getBoundingClientRect();
      const mouseX = e.clientX - rect.left;
      
      // Map mouseX back to frequency index
      const xMin = -3, xMax = 3;
      const W_plot = chartW - paddingLeft - paddingRight;
      
      // Calculate corresponding log frequency
      const logF = xMin + ((mouseX - paddingLeft) / W_plot) * (xMax - xMin);
      const freq = Math.pow(10, logF);

      if (freq < 0.0009 || freq > 1100) {
        tooltip.style.display = "none";
        return;
      }

      // Find closest calculated frequency
      let closestPt = soundingResults[0];
      let minDist = Math.abs(soundingResults[0].f - freq);
      soundingResults.forEach(pt => {
        const d = Math.abs(pt.f - freq);
        if (d < minDist) {
          minDist = d;
          closestPt = pt;
        }
      });

      const c = getChartCoords(closestPt.f, closestPt.rho_a, closestPt.phase);
      
      tooltip.style.display = "block";
      tooltip.style.left = (c.x + 15) + "px";
      tooltip.style.top = (c.y - 15) + "px";
      tooltip.innerHTML = `
        <div style="font-weight:bold;color:var(--text-primary);margin-bottom:3px;">测点读数:</div>
        f: ${closestPt.f >= 1000 ? (closestPt.f/1000).toFixed(1) + " kHz" : closestPt.f.toFixed(3) + " Hz"}<br>
        <span style="color:var(--color-amber)">&rho;_a: ${closestPt.rho_a.toFixed(1)} &Omega;&middot;m</span><br>
        <span style="color:var(--color-royal-blue)">&phi;: ${closestPt.phase.toFixed(1)}&deg;</span>
      `;
    }

    function hideSoundingTooltip() {
      const tooltip = document.getElementById("sounding-tooltip");
      if (tooltip) tooltip.style.display = "none";
    }

    // ----------------------------------------------------
    // Widget 3: 2D TE/TM Polarization Wave Simulator
    // ----------------------------------------------------
    let polCanvas, polCtx;
    let polTime = 0;

    function initPolarizationWaveCanvas() {
      polCanvas = document.getElementById("polarization-canvas");
      if (!polCanvas) return;

      polCanvas.width = polCanvas.parentElement.clientWidth;
      polCanvas.height = polCanvas.parentElement.clientHeight;
      polCtx = polCanvas.getContext("2d");

      switchPolMode(selectedPolarization);
    }

    function switchPolMode(mode) {

      function polAnimLoop() {
        polTime += 0.04;
        const W = polCanvas.width, H = polCanvas.height;
        polCtx.clearRect(0, 0, W, H);

        const borderX = W / 2;

        // Draw Left Medium: High resistivity (e.g. 100 Ohm-m)
        polCtx.fillStyle = "rgba(240, 233, 218, 0.4)";
        polCtx.fillRect(0, 0, borderX, H);

        // Draw Right Medium: Low resistivity (e.g. 1 Ohm-m)
        polCtx.fillStyle = "rgba(180, 170, 150, 0.4)";
        polCtx.fillRect(borderX, 0, W - borderX, H);

        // Draw boundary line
        polCtx.strokeStyle = "#cbd5e1";
        polCtx.lineWidth = 2;
        polCtx.beginPath();
        polCtx.moveTo(borderX, 0);

        if (mode === "TE") {
          // Draw TE Mode: Ex is out-of-page, represented by concentric circles that expand and fade
          // Left side wave length is longer (high resistivity = larger wavelength), Right is shorter
          const kLeft = 0.03, kRight = 0.12; 
          
          // Animate electric field dots
          for (let x = 30; x < W; x += 40) {
            const isLeft = (x < borderX);
            const distToBorder = isLeft ? borderX - x : x - borderX;
            const phase = isLeft ? polTime - distToBorder * kLeft : polTime - distToBorder * kRight;
            const amp = Math.sin(phase);
            const r = Math.abs(amp) * 10;
            
            polCtx.strokeStyle = "rgba(185, 28, 28, 0.75)";
            polCtx.fillStyle = amp >= 0 ? "rgba(185, 28, 28, 0.85)" : "rgba(37, 99, 235, 0.85)";
            
            polCtx.beginPath();
            polCtx.arc(x, H/2 - 30, r, 0, 2 * Math.PI);
            polCtx.fill();
            polCtx.stroke();
            
            // Draw cross or dot in center
            polCtx.fillStyle = "#ffffff";
            polCtx.font = "8px monospace";
            polCtx.textAlign = "center";
            polCtx.textBaseline = "middle";
            polCtx.fillText(amp >= 0 ? "•" : "x", x, H/2 - 30);

          polCtx.fillStyle = "var(--text-primary)";
          polCtx.fillText("Ex 电场 (垂直纸面)", 15, H/2 - 50);

          // Draw Magnetic field loops (closed ellipses crossing boundary smoothly)
          polCtx.strokeStyle = "rgba(37, 99, 235, 0.6)";
          polCtx.lineWidth = 1.5;
          polCtx.setLineDash([2, 1]);
          for (let r = 25; r < 90; r += 20) {
            polCtx.beginPath();
            polCtx.ellipse(borderX, H/2 + 40, r * 1.5, r, 0, 0, 2 * Math.PI);
            polCtx.stroke();

          polCtx.setLineDash([]);
          polCtx.fillStyle = "var(--color-royal-blue)";
          polCtx.fillText("Hy, Hz 磁力线 (闭合环流)", borderX - 70, H/2 + 105);

        } else {
          // Draw TM Mode: Hx is out of page. Electric fields (Ey, Ez) bend at boundary.
          // Draw bent electric field lines
          polCtx.strokeStyle = "rgba(185, 28, 28, 0.55)";
          polCtx.lineWidth = 2;
          
          for (let y = 40; y < H; y += 45) {
            polCtx.beginPath();
            // Wave propagation phase
            const phase = polTime - y * 0.03;
            const amp = Math.sin(phase) * 20;
            
            // Left segment
            polCtx.moveTo(0, y + amp);
            polCtx.lineTo(borderX, y);
            
            // Right segment (refracted, bending sharply)
            polCtx.lineTo(W, y + amp * 0.15); // Low resistivity shrinks field amplitude
            polCtx.stroke();
            
            // Draw little arrows on E-lines
            polCtx.fillStyle = "var(--color-crimson)";
            polCtx.beginPath();
            polCtx.arc(borderX / 2, y + amp * 0.5, 3, 0, 2*Math.PI);
            polCtx.fill();
          }
          polCtx.fillStyle = "var(--color-crimson)";
          polCtx.fillText("Ey, Ez 电场线 (跨界面发生屈服折射)", 15, H - 45);

          // Draw charge accumulation on interface
          for (let y = 30; y < H; y += 25) {
            const chargePhase = Math.sin(polTime * 1.5 - y * 0.05);
            if (Math.abs(chargePhase) > 0.45) {
              const isPos = chargePhase > 0;
              polCtx.fillStyle = isPos ? "var(--color-crimson)" : "var(--color-royal-blue)";
              polCtx.font = "bold 12px monospace";
              polCtx.fillText(isPos ? "+" : "-", borderX - 4, y);
            }
          }
          polCtx.fillStyle = "var(--text-primary)";
          polCtx.fillText("界面感应面电荷", borderX - 42, 35);
        }

        polAnimationId = requestAnimationFrame(polAnimLoop);
      }

      polAnimLoop();
    }

        // Axis label

    // ----------------------------------------------------
    // Widget 5: Solver Convergence Simulator
    // ----------------------------------------------------
    let convSvg;
    let convPoints = [];
    let convSimStep = 0;
    let maxSteps = 100;
    
    function initConvergencePlot() {
      convSvg = document.getElementById("conv-svg");
      if (!convSvg) return;
      
      // Draw static axes background
      drawConvPlotBackground();
    }
    
    function drawConvPlotBackground() {
      if (!convSvg) return;
      const W = 340, H = 250;
      const left = 45, right = 15, top = 20, bottom = 40;
      
      let html = ``;
      
      // Horizontal grid lines (for log residual: 10^0 to 10^-8)
      for (let i = 0; i >= -8; i--) {
        const y = top + ((0 - i) / 8) * (H - top - bottom);
        html += `<line x1="${left}" y1="${y}" x2="${W - right}" y2="${y}" class="grid-line" />`;
        html += `<text x="${left - 8}" y="${y + 4}" text-anchor="end" class="plot-axis-label">10${i === 0 ? '' : '^{' + i + '}'}</text>`;
      }
      
      // Vertical grid lines (for Iterations: 0 to 100)
      for (let step = 0; step <= 100; step += 20) {
        const x = left + (step / 100) * (W - left - right);
        html += `<line x1="${x}" y1="${top}" x2="${x}" y2="${H - bottom}" class="grid-line" />`;
        html += `<text x="${x}" y="${H - bottom + 16}" text-anchor="middle" class="plot-axis-label">${step}</text>`;
      }
      
      // Axes
      html += `<line x1="${left}" y1="${top}" x2="${left}" y2="${H - bottom}" class="axis-line" />`;
      html += `<line x1="${left}" y1="${H - bottom}" x2="${W - right}" y2="${H - bottom}" class="axis-line" />`;
      html += `<text x="${W/2}" y="${H - 8}" text-anchor="middle" font-size="10" fill="var(--text-muted)">迭代步数 (Iterations)</text>`;
      
      convSvg.innerHTML = html;
    }
    
    function runConvergenceSim() {
      const solver = document.getElementById("conv-solver").value;
      const prec = document.getElementById("conv-prec").value;
      const contrast = document.getElementById("conv-contrast").value;
      const statusText = document.getElementById("conv-status-text");
      
      if (convAnimationId) {
        cancelAnimationFrame(convAnimationId);
      }
      
      convPoints = [];
      convSimStep = 0;
      
      // Define target steps and decay behavior based on selection
      // AMG preconditioning yields extremely fast convergence
      // No preconditioning with high contrast ratio will fail or oscilliate
      let convergeStepLimit = 60;
      let finalRes = 1e-8;
      let fails = false;
      let speedFactor = 0.2; // log residual decay per step
      
      if (solver === "direct") {
        convergeStepLimit = 1;
        finalRes = 1e-15;
      } else {
        // Iterative solvers
        let baseDecay = 0.12; // default GMRES
        if (solver === "bicg") baseDecay = 0.18; // BiCGSTAB converges faster but oscillates more
        
        let precMult = 1.0;
        if (prec === "amg") {
          precMult = 3.5; // AMG is powerful
          convergeStepLimit = 15;
        } else if (prec === "ilu") {
          precMult = 1.4;
          convergeStepLimit = 40;
        } else {
          // No preconditioner
          precMult = 0.3;
          convergeStepLimit = 100;
          if (contrast === "med" || contrast === "high") {
            fails = true;
          }
        }
        
        let contrastMult = 1.0;
        if (contrast === "med") contrastMult = 0.6;
        else if (contrast === "high") contrastMult = 0.15;
        
        speedFactor = baseDecay * precMult * contrastMult;
      }
      
      statusText.innerHTML = "正在启动计算引擎...";
      statusText.style.color = "var(--color-amber)";
      
      const W = 340, H = 250;
      const left = 45, right = 15, top = 20, bottom = 40;
      
      function simLoop() {
        convSimStep++;
        
        let currentResLog = 0;
        
        if (solver === "direct") {
          currentResLog = -15;
          convPoints.push({step: 1, resLog: -15});
        } else {
          // Simulate iteration error curve
          let noise = (Math.random() - 0.5) * 0.4;
          // BiCGSTAB has high oscillation
          if (solver === "bicg" && prec !== "amg") {
            noise = (Math.random() - 0.5) * 1.8;
          }
          
          if (fails) {
            // Fails: stalls at high residual (condition number too bad)
            const floor = contrast === "high" ? -1.0 : -2.5;
            currentResLog = Math.max(floor + noise, 0 - convSimStep * speedFactor + noise);
          } else {
            // Converges
            currentResLog = Math.max(-8.5, 0 - convSimStep * speedFactor + noise);
          }
          convPoints.push({step: convSimStep, resLog: currentResLog});
        }
        
        // Redraw SVG with curves
        drawConvPlotBackground();
        
        // Draw line
        let dPath = "";
        convPoints.forEach((pt, idx) => {
          const px = left + (pt.step / 100) * (W - left - right);
          // Map log residual 0 to -8
          const clampedLog = Math.max(-8, Math.min(0, pt.resLog));
          const py = top + ((0 - clampedLog) / 8) * (H - top - bottom);
          if (idx === 0) dPath += `M ${px} ${py}`;
          else dPath += ` L ${px} ${py}`;
        });
        
        const pathColor = solver === "bicg" ? "var(--color-crimson)" : "var(--color-royal-blue)";
        convSvg.innerHTML += `<path d="${dPath}" fill="none" stroke="${pathColor}" stroke-width="2.5" />`;
        
        // Highlight last point
        if (convPoints.length > 0) {
          const last = convPoints[convPoints.length - 1];
          const px = left + (last.step / 100) * (W - left - right);
          const clampedLog = Math.max(-8, Math.min(0, last.resLog));
          const py = top + ((0 - clampedLog) / 8) * (H - top - bottom);
          convSvg.innerHTML += `<circle cx="${px}" cy="${py}" r="4" fill="var(--color-amber)" />`;
        }
        
        // Check termination
        if (solver === "direct") {
          statusText.innerHTML = "直接解法(LU)完成！求解耗时: 6.2s。<br><span style='color:var(--color-purple)'>内存消耗: 38.5 GB (高)</span>";
          return;
        }
        
        const lastPt = convPoints[convPoints.length - 1];
        if (lastPt.resLog <= -7.0) {
          statusText.innerHTML = `迭代解法成功收敛！迭代次数: ${convSimStep} 次。<br><span style='color:var(--color-forest-green)'>内存占用: 1.8 GB (省)</span>`;
          statusText.style.color = "var(--color-forest-green)";
          return;
        }
        
        if (convSimStep >= 100) {
          if (fails) {
            statusText.innerHTML = "❌ 警告: 求解发散或陷入停滞！<br>矩阵高对比度条件数过大。请启用 AMG/ILU 预条件器。";
            statusText.style.color = "var(--color-crimson)";
          } else {
            statusText.innerHTML = "迭代达到步数上限！";
          }
          return;
        }
        
        convAnimationId = setTimeout(simLoop, 40);
      }
      
      simLoop();
    }

    // ----------------------------------------------------
    // Widget 6: AI OOD (Out-of-Distribution) Defensive Simulator
    // ----------------------------------------------------
    let oodSvg;
    
    function initOODPlot() {
      oodSvg = document.getElementById("ood-svg");
      if (!oodSvg) return;
      
      runOODSimulation();

    function runOODSimulation() {
      const contrastEl = document.getElementById("ood-contrast");
      const slopeEl = document.getElementById("ood-slope");
      const statusText = document.getElementById("ood-status-text");
      const alarmBanner = document.getElementById("ood-alarm");
      
      if (!contrastEl || !slopeEl || !oodSvg) return;
      
      const contrastExp = parseFloat(contrastEl.value);
      const slope = parseFloat(slopeEl.value);
      const contrast = Math.pow(10, contrastExp);
      
      document.getElementById("ood-contrast-val").innerText = contrast >= 1000000 ? "10^6 : 1" : contrast.toFixed(0) + " : 1";
      document.getElementById("ood-slope-val").innerText = slope + "°";
      
      // Calculate Mahalanobis distance
      // Training base distribution: contrastExp mean=2.0, slope mean=5.0
      // Ellipse bounds: contrastExp (1 to 3.5), slope (0 to 18)
      const dist = Math.sqrt(Math.pow((contrastExp - 2) / 0.8, 2) + Math.pow((slope - 5) / 6, 2));
      
      // Draw Plot
      const W = 250, H = 250;
      const cx = W / 2, cy = H / 2;
      
      let html = ``;
      
      // 1. Draw grid background
      html += `<rect x="0" y="0" width="${W}" height="${H}" fill="#f6efe2" stroke="#e6dfd3" />`;
      html += `<line x1="${cx}" y1="0" x2="${cx}" y2="${H}" stroke="rgba(203,213,225,0.8)" stroke-width="1" />`;
      html += `<line x1="0" y1="${cy}" x2="${W}" y2="${cy}" stroke="rgba(203,213,225,0.8)" stroke-width="1" />`;
      
      // 2. Draw 3-sigma training confidence envelope (In-distribution ellipse)
      // Radius along X (contrast) is 0.8 * 30px = 24px, along Y (slope) is 6 * 4px = 24px
      const rx = 0.8 * 45; // scale factor
      const ry = 6 * 3.5;
      
      html += `<ellipse cx="${cx}" cy="${cy}" rx="${rx * 3}" ry="${ry * 3}" fill="rgba(22, 163, 74, 0.08)" stroke="var(--color-forest-green)" stroke-width="1.5" stroke-dasharray="4 2" />`;
      html += `<text x="${cx}" y="${cy - ry*3.2}" text-anchor="middle" font-size="8" fill="var(--color-forest-green)">3&sigma; 训练分布包络边界</text>`;
      
      // 3. Map current model point
      // Map contrastExp (1 to 6) to X (30 to 220)
      const px = cx + (contrastExp - 2) * 35;
      // Map slope (0 to 45) to Y (cy down to top)
      const py = cy - (slope - 5) * 3.2;
      
      // Draw path indicator line
      html += `<line x1="${cx}" y1="${cy}" x2="${px}" y2="${py}" stroke="rgba(180, 83, 9, 0.5)" stroke-width="1.2" />`;
      
      // Draw current dot
      const dotColor = dist > 3.0 ? "var(--color-crimson)" : "var(--color-forest-green)";
      html += `<circle cx="${px}" cy="${py}" r="6" fill="${dotColor}" class="glowing-dot" />`;
      html += `<circle cx="${px}" cy="${py}" r="10" fill="none" stroke="${dotColor}" stroke-width="1" />`;
      
      // Draw axis tags
      html += `<text x="${W - 5}" y="${cy - 4}" text-anchor="end" font-size="8" fill="var(--text-muted)">电阻率对比度 &rarr;</text>`;
      html += `<text x="${cx + 4}" y="10" text-anchor="start" font-size="8" fill="var(--text-muted)">地表坡度 &uarr;</text>`;

      oodSvg.innerHTML = html;
      
      const score = Math.max(0, 1 - (dist / 4.5)).toFixed(2);
      
      // Update logic and routing Fallback message
      if (dist > 3.0) {
        alarmBanner.style.display = "block";
        statusText.innerHTML = `AI 适用度评分: <b>${score} (极低风险发散)</b><br>马氏距离 D_OOD = <b>${dist.toFixed(2)} &gt; 3.0</b><br><span style='color:var(--color-crimson)'>总控机制已切断 AI，强制重路由退回传统有限元 (FEM) 数值引擎计算。</span>`;
        statusText.style.color = "var(--color-crimson)";
      } else {
        alarmBanner.style.display = "none";
        statusText.innerHTML = `AI 适用度评分: <b>${score} (安全)</b><br>马氏距离 D_OOD = <b>${dist.toFixed(2)} &le; 3.0</b><br><span style='color:var(--color-forest-green)'>输入安全。挂载 AI Surrogate 快速计算信道 (时耗约 0.15s)。</span>`;
        statusText.style.color = "var(--color-forest-green)";
      }
    }

    // ----------------------------------------------------
    // Three.js 3D WebGL renderers implementation
    // ----------------------------------------------------

    // 1. Slide 11 (Dimension Viewer)
    function initDim3DScene() {
      const container = document.getElementById("dim-3d-canvas");
      if (!container) return;

      if (typeof THREE === 'undefined') {
        container.innerHTML = `
          <div style="display:flex; flex-direction:column; align-items:center; justify-content:center; height:100%; color:var(--text-secondary); padding:20px; text-align:center; background:var(--widget-canvas-bg); border:1px solid var(--border-color); border-radius:12px;">
            <p style="font-size:18px; font-weight:bold; color:var(--color-crimson); margin-bottom:8px;">⚠️ 3D 渲染组件加载失败</p>
            <p style="font-size:13px; max-width:400px; margin-bottom:4px;">未检测到 Three.js 库。这通常是因为本地离线或网络原因无法加载 CDN 资源，或者浏览器安全设置拦截了外部脚本。</p>
            <p style="font-size:12px; color:var(--text-muted);">（其他控制方程、2D 模拟等交互依然可用）</p>
          </div>
        `;
        return;
      }

      const W = container.clientWidth, H = container.clientHeight;

      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0xfaf6ee);

      const camera = new THREE.PerspectiveCamera(40, W / H, 0.1, 100);
      camera.position.set(5.5, 3.5, 7.5);

      const renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(W, H);
      container.appendChild(renderer.domElement);

      const controls = new THREE.OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.05;
      controls.maxPolarAngle = Math.PI / 2 + 0.1;

      const ambientLight = new THREE.AmbientLight(0xffffff, 0.65);
      scene.add(ambientLight);

      const dirLight = new THREE.DirectionalLight(0xffffff, 0.75);
      dirLight.position.set(5, 10, 5);
      scene.add(dirLight);

      // Add a coordinate helper grid
      const gridHelper = new THREE.GridHelper(8, 8, 0xb45309, 0xe6dfd3);
      gridHelper.position.y = -1.5;
      scene.add(gridHelper);

      const meshGroup = new THREE.Group();
      scene.add(meshGroup);

      threeInstances.dim = { renderer, scene, camera, controls, meshGroup, animationId: null };

      function animate() {
        threeInstances.dim.animationId = requestAnimationFrame(animate);
        controls.update();
        renderer.render(scene, camera);
      }
      animate();
    }

    function switchDim3D(dim) {
      selectedDim3D = dim;
      const inst = threeInstances.dim;
      if (!inst || !inst.scene) return;

      const dims = ["1D", "2D", "3D"];
      dims.forEach(d => {
        const btn = document.getElementById(`dim-${d.toLowerCase()}-btn`);
        if (btn) {
          if (d === dim) btn.classList.add("active");
          else btn.classList.remove("active");
        }
      });

      const textEl = document.getElementById("dim-detail-text");
      const group = inst.meshGroup;
      
      while(group.children.length > 0) {
        const obj = group.children[0];
        group.remove(obj);
      }

      // Base Box wireframe skeleton
      const wireframeGeom = new THREE.BoxGeometry(4, 3, 4);
      const edges = new THREE.EdgesGeometry(wireframeGeom);
      const lineMaterial = new THREE.LineBasicMaterial({ color: 0x8c7e6b, linewidth: 1 });
      const boxWireframe = new THREE.LineSegments(edges, lineMaterial);
      group.add(boxWireframe);

      if (dim === "1D") {
        textEl.innerHTML = `
          <p>• <strong>物性假设</strong>：地下电性仅随垂直深度 $z$ 方向改变，水平 $x, y$ 轴方向无限均匀。</p>
          <p style="margin-top: 5px;">• <strong>正正演计算复杂度</strong>：低。由于微分方程降阶为一维常微分方程，地表复阻抗存在严密的解析迭代解，计算耗时仅为微秒级，可作为反演程序精度检验的标准标定库。</p>
        `;

        const hGeoms = [
          new THREE.BoxGeometry(3.98, 1.0, 3.98),
          new THREE.BoxGeometry(3.98, 1.0, 3.98),
          new THREE.BoxGeometry(3.98, 1.0, 3.98)
        ];
        const colors = [0xe6dfd3, 0xd4cbb9, 0xb8ab97];
        hGeoms.forEach((geom, idx) => {
          const mat = new THREE.MeshLambertMaterial({ color: colors[idx], transparent: true, opacity: 0.85 });
          const mesh = new THREE.Mesh(geom, mat);
          mesh.position.y = 1.0 - idx * 1.0;
          group.add(mesh);
        });

      } else if (dim === "2D") {
        textEl.innerHTML = `
          <p>• <strong>物性假设</strong>：电阻率 $\\sigma(y,z)$ 仅在 $y-z$ 面剖面内突变，沿着走向 $x$ 方向完全均匀。</p>
          <p style="margin-top: 5px;">• <strong>正正演计算复杂度</strong>：中等。解耦为 TE 极化和 TM 极化两个独立二维偏微分方程。走向边界处的场分布非常关键，目前多保真或迭代求解器能在几秒内完成单频求解。</p>
        `;

        // Background box
        const bgGeom = new THREE.BoxGeometry(3.98, 2.98, 3.98);
        const bgMat = new THREE.MeshLambertMaterial({ color: 0xe6dfd3, transparent: true, opacity: 0.65 });
        const bgMesh = new THREE.Mesh(bgGeom, bgMat);
        group.add(bgMesh);

        // 2D strike anomaly box extending along X axis (4m length)
        const anomalyGeom = new THREE.BoxGeometry(4.0, 1.0, 1.6);
        const anomalyMat = new THREE.MeshLambertMaterial({ color: 0xb45309 });
        const anomalyMesh = new THREE.Mesh(anomalyGeom, anomalyMat);
        anomalyMesh.position.set(0, -0.2, 0);
        group.add(anomalyMesh);

      } else if (dim === "3D") {
        textEl.innerHTML = `
          <p>• <strong>物性假设</strong>：地下电阻率在 $x, y, z$ 三个维度上任意突变变化，贴合最真实的地质起伏。</p>
          <p style="margin-top: 5px;">• <strong>正正演计算复杂度</strong>：极高。六分量强耦合，无法解耦，必须装配上百万维复稀疏病态代数阵，消耗巨大的内存与求解时间。这也是科学家极力研发 AI Surrogate 和 FNO 的原因。</p>
        `;

        const bgGeom = new THREE.BoxGeometry(3.98, 2.98, 3.98);
        const bgMat = new THREE.MeshLambertMaterial({ color: 0xe6dfd3, transparent: true, opacity: 0.45 });
        const bgMesh = new THREE.Mesh(bgGeom, bgMat);
        group.add(bgMesh);

        // Localized 3D anomaly bodies
        const localGeom1 = new THREE.SphereGeometry(0.7, 32, 32);
        const localMat1 = new THREE.MeshLambertMaterial({ color: 0xb45309 });
        const localMesh1 = new THREE.Mesh(localGeom1, localMat1);
        localMesh1.position.set(-0.6, 0.3, -0.6);
        group.add(localMesh1);

        const localGeom2 = new THREE.BoxGeometry(1.2, 0.8, 1.2);
        const localMat2 = new THREE.MeshLambertMaterial({ color: 0x7c3aed });
        const localMesh2 = new THREE.Mesh(localGeom2, localMat2);
        localMesh2.position.set(0.6, -0.5, 0.6);
        group.add(localMesh2);
      }

      if (window.MathJax && typeof window.MathJax.typeset === 'function') {
        window.MathJax.typeset([textEl]);
      }
    }

    // 2. Slide 14 (Yee Staggered Cell)
    function initYee3DScene() {
      const container = document.getElementById("yee-3d-canvas");
      if (!container) return;

      if (typeof THREE === 'undefined') {
        container.innerHTML = `
          <div style="display:flex; flex-direction:column; align-items:center; justify-content:center; height:100%; color:var(--text-secondary); padding:20px; text-align:center; background:var(--widget-canvas-bg); border:1px solid var(--border-color); border-radius:12px;">
            <p style="font-size:18px; font-weight:bold; color:var(--color-crimson); margin-bottom:8px;">⚠️ 3D 渲染组件加载失败</p>
            <p style="font-size:13px; max-width:400px; margin-bottom:4px;">未检测到 Three.js 库。这通常是因为本地离线或网络原因无法加载 CDN 资源，或者浏览器安全设置拦截了外部脚本。</p>
            <p style="font-size:12px; color:var(--text-muted);">（其他控制方程、2D 模拟等交互依然可用）</p>
          </div>
        `;
        return;
      }

      const W = container.clientWidth, H = container.clientHeight;

      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0xfaf6ee);

      const camera = new THREE.PerspectiveCamera(40, W / H, 0.1, 100);
      camera.position.set(5.5, 3.5, 6.5);

      const renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(W, H);
      container.appendChild(renderer.domElement);

      const controls = new THREE.OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.05;

      const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
      scene.add(ambientLight);

      const dirLight = new THREE.DirectionalLight(0xffffff, 0.75);
      dirLight.position.set(3, 10, 5);
      scene.add(dirLight);

      // Translucent Yee Box skeleton
      const boxGeom = new THREE.BoxGeometry(3, 3, 3);
      const boxEdges = new THREE.EdgesGeometry(boxGeom);
      const lineMat = new THREE.LineBasicMaterial({ color: 0x8c7e6b, linewidth: 2.5 });
      const gridBox = new THREE.LineSegments(boxEdges, lineMat);
      scene.add(gridBox);

      const eGroup = new THREE.Group();
      const hGroup = new THREE.Group();
      scene.add(eGroup);
      scene.add(hGroup);

      // 12 E Arrow helpers on edges (Red)
      const edgeVectors = [
        // 4 X-aligned edges
        { start: new THREE.Vector3(-1.5, -1.5, -1.5), dir: new THREE.Vector3(1, 0, 0) },
        { start: new THREE.Vector3(-1.5, 1.5, -1.5), dir: new THREE.Vector3(1, 0, 0) },
        { start: new THREE.Vector3(-1.5, -1.5, 1.5), dir: new THREE.Vector3(1, 0, 0) },
        { start: new THREE.Vector3(-1.5, 1.5, 1.5), dir: new THREE.Vector3(1, 0, 0) },
        // 4 Y-aligned edges
        { start: new THREE.Vector3(-1.5, -1.5, -1.5), dir: new THREE.Vector3(0, 1, 0) },
        { start: new THREE.Vector3(1.5, -1.5, -1.5), dir: new THREE.Vector3(0, 1, 0) },
        { start: new THREE.Vector3(-1.5, -1.5, 1.5), dir: new THREE.Vector3(0, 1, 0) },
        { start: new THREE.Vector3(1.5, -1.5, 1.5), dir: new THREE.Vector3(0, 1, 0) },
        // 4 Z-aligned edges
        { start: new THREE.Vector3(-1.5, -1.5, -1.5), dir: new THREE.Vector3(0, 0, 1) },
        { start: new THREE.Vector3(1.5, -1.5, -1.5), dir: new THREE.Vector3(0, 0, 1) },
        { start: new THREE.Vector3(-1.5, 1.5, -1.5), dir: new THREE.Vector3(0, 0, 1) },
        { start: new THREE.Vector3(1.5, 1.5, -1.5), dir: new THREE.Vector3(0, 0, 1) }
      ];

      edgeVectors.forEach(edge => {
        const arrowLength = 1.3;
        const arrowCenter = edge.start.clone().add(edge.dir.clone().multiplyScalar(1.5 - arrowLength/2));
        const arrowHelper = new THREE.ArrowHelper(edge.dir, arrowCenter, arrowLength, 0xb91c1c, 0.35, 0.22);
        eGroup.add(arrowHelper);
      });

      // 6 H Arrow helpers on face centers (Blue)
      const faceVectors = [
        { center: new THREE.Vector3(1.5, 0, 0), dir: new THREE.Vector3(1, 0, 0) },
        { center: new THREE.Vector3(-1.5, 0, 0), dir: new THREE.Vector3(-1, 0, 0) },
        { center: new THREE.Vector3(0, 1.5, 0), dir: new THREE.Vector3(0, 1, 0) },
        { center: new THREE.Vector3(0, -1.5, 0), dir: new THREE.Vector3(0, -1, 0) },
        { center: new THREE.Vector3(0, 0, 1.5), dir: new THREE.Vector3(0, 0, 1) },
        { center: new THREE.Vector3(0, 0, -1.5), dir: new THREE.Vector3(0, 0, -1) }
      ];

      faceVectors.forEach(face => {
        const arrowLength = 1.1;
        const arrowStart = face.center.clone().sub(face.dir.clone().multiplyScalar(0.2));
        const arrowHelper = new THREE.ArrowHelper(face.dir, arrowStart, arrowLength, 0x2563eb, 0.3, 0.2);
        hGroup.add(arrowHelper);
      });

      threeInstances.yee = { renderer, scene, camera, controls, eGroup, hGroup, animationId: null };

      function animate() {
        threeInstances.yee.animationId = requestAnimationFrame(animate);
        controls.update();
        renderer.render(scene, camera);
      }
      animate();
    }

    function toggleYeeE() {
      const show = document.getElementById("show-e-fields").checked;
      const inst = threeInstances.yee;
      if (inst && inst.eGroup) inst.eGroup.visible = show;
    }

    function toggleYeeH() {
      const show = document.getElementById("show-h-fields").checked;
      const inst = threeInstances.yee;
      if (inst && inst.hGroup) inst.hGroup.visible = show;
    }

    // 3. Slide 17 (FEM Mesh with Cutting Plane)
    function initFEM3DScene() {
      const container = document.getElementById("fem-3d-canvas");
      if (!container) return;

      if (typeof THREE === 'undefined') {
        container.innerHTML = `
          <div style="display:flex; flex-direction:column; align-items:center; justify-content:center; height:100%; color:var(--text-secondary); padding:20px; text-align:center; background:var(--widget-canvas-bg); border:1px solid var(--border-color); border-radius:12px;">
            <p style="font-size:18px; font-weight:bold; color:var(--color-crimson); margin-bottom:8px;">⚠️ 3D 渲染组件加载失败</p>
            <p style="font-size:13px; max-width:400px; margin-bottom:4px;">未检测到 Three.js 库。这通常是因为本地离线或网络原因无法加载 CDN 资源，或者浏览器安全设置拦截了外部脚本。</p>
            <p style="font-size:12px; color:var(--text-muted);">（其他控制方程、2D 模拟等交互依然可用）</p>
          </div>
        `;
        return;
      }

      const W = container.clientWidth, H = container.clientHeight;

      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0xfaf6ee);

      const camera = new THREE.PerspectiveCamera(40, W / H, 0.1, 100);
      camera.position.set(6, 4, 8);

      const renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(W, H);
      renderer.localClippingEnabled = true;
      container.appendChild(renderer.domElement);

      const controls = new THREE.OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.05;
      controls.maxPolarAngle = Math.PI / 2 + 0.1;

      const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
      scene.add(ambientLight);

      const dirLight = new THREE.DirectionalLight(0xffffff, 0.85);
      dirLight.position.set(4, 10, 4);
      scene.add(dirLight);

      // Clipping plane along Y axis
      const clipPlane = new THREE.Plane(new THREE.Vector3(0, -1, 0), 0);

      const meshGroup = new THREE.Group();
      scene.add(meshGroup);

      // 3D Topography Plane (Sine-cosine mountain)
      const terrainGeo = new THREE.PlaneGeometry(5, 5, 14, 14);
      terrainGeo.rotateX(-Math.PI / 2);
      
      const pos = terrainGeo.attributes.position;
      for (let i = 0; i < pos.count; i++) {
        const x = pos.getX(i);
        const z = pos.getZ(i);
        const height = Math.cos(x * 0.75) * Math.cos(z * 0.75) * 0.9;
        pos.setY(i, height);
      }
      terrainGeo.computeVertexNormals();

      const terrainMat = new THREE.MeshLambertMaterial({ 
        color: 0xd4cbb9, 
        wireframe: true, 
        clippingPlanes: [clipPlane]
      });
      const terrain = new THREE.Mesh(terrainGeo, terrainMat);
      meshGroup.add(terrain);

      // Underground finite element tetra mesh grid simulation
      const gridGeo = new THREE.BoxGeometry(4.6, 2.5, 4.6, 10, 5, 10);
      const gridMat = new THREE.MeshLambertMaterial({
        color: 0x8c7e6b,
        wireframe: true,
        transparent: true,
        opacity: 0.18,
        clippingPlanes: [clipPlane]
      });
      const grid = new THREE.Mesh(gridGeo, gridMat);
      grid.position.y = -1.25;
      meshGroup.add(grid);

      // Underground high-contrast target anomaly (Red sphere representing low resistance ore)
      const anomalyGeo = new THREE.SphereGeometry(0.7, 32, 32);
      const anomalyMat = new THREE.MeshLambertMaterial({
        color: 0xb91c1c,
        emissive: 0x3a0000,
        clippingPlanes: [clipPlane]
      });
      const anomalyMesh = new THREE.Mesh(anomalyGeo, anomalyMat);
      anomalyMesh.position.set(0, -0.9, 0);
      meshGroup.add(anomalyMesh);

      // Deep earth floor
      const floorGeo = new THREE.PlaneGeometry(5, 5);
      floorGeo.rotateX(-Math.PI / 2);
      const floorMat = new THREE.MeshBasicMaterial({ color: 0xe6dfd3, side: THREE.DoubleSide });
      const floor = new THREE.Mesh(floorGeo, floorMat);
      floor.position.y = -2.5;
      meshGroup.add(floor);

      threeInstances.fem = { renderer, scene, camera, controls, clipPlane, meshGroup, animationId: null };

      function animate() {
        threeInstances.fem.animationId = requestAnimationFrame(animate);
        controls.update();
        renderer.render(scene, camera);
      }
      animate();
      
      updateFEMClip();
    }

    function updateFEMClip() {
      const slider = document.getElementById("fem-clip-slider");
      const inst = threeInstances.fem;
      if (slider && inst && inst.clipPlane) {
        const val = parseFloat(slider.value);
        inst.clipPlane.constant = val / 2.0;
        document.getElementById("fem-clip-val").innerText = val.toFixed(1);
      }
    }
  </script>
